        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: item_type
        schema:
          type: integer
      - in: query
        name: job
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - INVESTIGATING
          - OPEN
          - RESOLVED
          - WRITTEN_OFF
        description: |-
          * `OPEN` - Open
          * `INVESTIGATING` - Under investigation
          * `RESOLVED` - Resolved
          * `WRITTEN_OFF` - Written off
      - in: query
        name: type
        schema:
          type: string
          enum:
          - COUNT
          - RELEASE
          - RETURN
          - SYNC
        description: |-
          * `RETURN` - Return differed from what was declared
          * `RELEASE` - Release differed from what was approved
          * `COUNT` - Stock count found a difference
          * `SYNC` - Offline document could not be posted
      tags:
      - variances
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVarianceList'
          description: ''
    post:
      operationId: variances_create
      description: |-
        A variance is a finding, not something anyone declares.

        Allowing one to be created directly would let the register be padded or
        pre-emptively resolved, which is precisely the trust it exists to carry.
      tags:
      - variances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VarianceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VarianceRequest'
          multipart/form-data:
