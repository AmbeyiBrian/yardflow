    Role:
      type: object
      description: |-
        Drop fields the requesting user is not permitted to see.

        Subclasses set ``permission_gated_fields`` — a mapping of permission
        codename to the field names it unlocks.

        With no request in context (a management command, a test building a
        serializer directly, an export running in Celery) **nothing is dropped**.
        Those callers have already passed whatever check applies to them, and
        silently emptying their output would be a bug that only shows up in a
        report somebody trusted.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        is_system:
          type: boolean
          readOnly: true
          description: Seeded when the tenant was created, rather than hand-made.
        codenames:
          type: array
          items:
            type: string
          description: Permissions granted.
        user_count:
          type: integer
          readOnly: true
        day_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Default cost of a day for this role, excluding VAT. Not pay.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_system
      - name
      - user_count
    RoleRequest:
      type: object
      description: |-
        Drop fields the requesting user is not permitted to see.

        Subclasses set ``permission_gated_fields`` — a mapping of permission
        codename to the field names it unlocks.

        With no request in context (a management command, a test building a
        serializer directly, an export running in Celery) **nothing is dropped**.
        Those callers have already passed whatever check applies to them, and
        silently emptying their output would be a bug that only shows up in a
        report somebody trusted.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 255
        codenames:
          type: array
          items:
            type: string
            minLength: 1
          description: Permissions granted.
        day_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Default cost of a day for this role, excluding VAT. Not pay.
      required:
      - name
