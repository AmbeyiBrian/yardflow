openapi: 3.0.3
info:
  title: YardFlow API
  version: 1.0.0
  description: Yard inventory and gate control.
paths:
  /admin-api/organizations/:
    get:
      operationId: admin_api_organizations_list
      description: '``/admin-api/organizations`` — list, create and suspend tenants
        (A1, A2).'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        description: |-
          * `ACTIVE` - Active
          * `SUSPENDED` - Suspended
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationList'
          description: ''
    post:
      operationId: admin_api_organizations_create
      description: '``/admin-api/organizations`` — list, create and suspend tenants
        (A1, A2).'
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /admin-api/organizations/{id}/:
    get:
      operationId: admin_api_organizations_retrieve
      description: '``/admin-api/organizations`` — list, create and suspend tenants
        (A1, A2).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organization.
        required: true
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
    patch:
      operationId: admin_api_organizations_partial_update
      description: '``/admin-api/organizations`` — list, create and suspend tenants
        (A1, A2).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organization.
        required: true
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /admin-api/organizations/{id}/reinstate/:
    post:
      operationId: admin_api_organizations_reinstate_create
      description: Undo a suspension. A2 says data survives, so this is a status change.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organization.
        required: true
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuspensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuspensionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /admin-api/organizations/{id}/suspend/:
    post:
      operationId: admin_api_organizations_suspend_create
      description: 'A2: suspend a non-paying or dormant customer. Never deletes data.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this organization.
        required: true
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspensionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuspensionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuspensionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/approval-rules:
    get:
      operationId: approval_rules_list
      description: '``/api/v1/approval-rules`` (F3, T4.3).'
      parameters:
      - in: query
        name: criticality
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
          - NONE
        description: |-
          * `NONE` - None
          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: required_role
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - approval-rules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRuleList'
          description: ''
    post:
      operationId: approval_rules_create
      description: '``/api/v1/approval-rules`` (F3, T4.3).'
      tags:
      - approval-rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRule'
          description: ''
  /api/v1/approval-rules/{id}:
    get:
      operationId: approval_rules_retrieve
      description: '``/api/v1/approval-rules`` (F3, T4.3).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval rule.
        required: true
      tags:
      - approval-rules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRule'
          description: ''
    put:
      operationId: approval_rules_update
      description: '``/api/v1/approval-rules`` (F3, T4.3).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval rule.
        required: true
      tags:
      - approval-rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRule'
          description: ''
    patch:
      operationId: approval_rules_partial_update
      description: '``/api/v1/approval-rules`` (F3, T4.3).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval rule.
        required: true
      tags:
      - approval-rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRuleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRule'
          description: ''
    delete:
      operationId: approval_rules_destroy
      description: '``/api/v1/approval-rules`` (F3, T4.3).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval rule.
        required: true
      tags:
      - approval-rules
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/approvals:
    get:
      operationId: approvals_list
      description: |-
        ``/api/v1/approvals`` (F4).

        Read-only: a decision is made through the document's own action
        (``/gate-outs/{id}/approve``), so there is exactly one code path per
        decision and the audit trail cannot be written from two places.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: document_type
        schema:
          type: string
      - in: query
        name: level
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - ESCALATED
          - PENDING
          - REJECTED
          - SUPERSEDED
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `ESCALATED` - Escalated
          * `SUPERSEDED` - Superseded
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequestList'
          description: ''
  /api/v1/approvals/{id}:
    get:
      operationId: approvals_retrieve
      description: |-
        ``/api/v1/approvals`` (F4).

        Read-only: a decision is made through the document's own action
        (``/gate-outs/{id}/approve``), so there is exactly one code path per
        decision and the audit trail cannot be written from two places.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval request.
        required: true
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/v1/approvals/{id}/deep-link:
    get:
      operationId: approvals_deep_link_retrieve
      description: |-
        A short-lived signed link to this approval (F4, §9.2, T4.18).

        §9.2: "approval deep links are short-lived signed URLs that land on the
        approval screen. **They authenticate nothing by themselves** — the user
        still logs in or presents a fingerprint."
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this approval request.
        required: true
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/approvals/pending:
    get:
      operationId: approvals_pending_list
      description: |-
        What this user can act on now (F4).

        Filtered to the caller's own roles and delegations: a list showing
        approvals somebody else must make is noise, and noise is what stops
        people reading the list at all.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: document_type
        schema:
          type: string
      - in: query
        name: level
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - ESCALATED
          - PENDING
          - REJECTED
          - SUPERSEDED
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `ESCALATED` - Escalated
          * `SUPERSEDED` - Superseded
      tags:
      - approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequestList'
          description: ''
  /api/v1/attachment-targets:
    get:
      operationId: attachment_targets_retrieve
      description: |-
        ``/api/v1/attachment-targets`` — what may be attached to, and by whom.

        The frontend needs to know whether to show a camera button before the user
        taps it. Deriving that from the same map the endpoint enforces means the
        button appears exactly when the upload would succeed.
      tags:
      - attachment-targets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentTargets'
          description: ''
  /api/v1/attachments:
    get:
      operationId: attachments_list
      description: |-
        ``/api/v1/attachments`` (§6, §4.13).

        Listing is always by target: ``?target_type=jobs.JobCloseout&target_id=12``.
        An unfiltered list of every file in the tenant is not a question any screen
        asks, and answering it would put one organization's whole evidence trail
        behind a single request.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
        description: Id of that record
      - in: query
        name: target_type
        schema:
          type: string
        description: Model label, e.g. jobs.Job
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: |-
        ``/api/v1/attachments`` (§6, §4.13).

        Listing is always by target: ``?target_type=jobs.JobCloseout&target_id=12``.
        An unfiltered list of every file in the tenant is not a question any screen
        asks, and answering it would put one organization's whole evidence trail
        behind a single request.
      tags:
      - attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/{id}:
    get:
      operationId: attachments_retrieve
      description: |-
        ``/api/v1/attachments`` (§6, §4.13).

        Listing is always by target: ``?target_type=jobs.JobCloseout&target_id=12``.
        An unfiltered list of every file in the tenant is not a question any screen
        asks, and answering it would put one organization's whole evidence trail
        behind a single request.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: |-
        ``/api/v1/attachments`` (§6, §4.13).

        Listing is always by target: ``?target_type=jobs.JobCloseout&target_id=12``.
        An unfiltered list of every file in the tenant is not a question any screen
        asks, and answering it would put one organization's whole evidence trail
        behind a single request.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attachments/{id}/url:
    get:
      operationId: attachments_url_retrieve
      description: |-
        A fresh signed link (§6, N-7).

        Separate from the serializer because links expire: a screen open for ten
        minutes needs to ask again rather than reload the whole document.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUrl'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: '``POST /api/v1/auth/login`` — email or phone plus password (B1).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: '``POST /api/v1/auth/logout`` — revoke the refresh token (B1).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      description: '``POST /api/v1/auth/password-reset`` (B2).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: '``POST /api/v1/auth/password-reset/confirm`` (B2, and A1''s invitation).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        ``POST /api/v1/auth/refresh``.

        Rotation and blacklist-after-rotation are on (see SIMPLE_JWT), so a stolen
        refresh token stops working as soon as the legitimate holder uses theirs.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/webauthn/assert/begin:
    post:
      operationId: auth_webauthn_assert_begin_create
      description: |-
        ``POST /api/v1/auth/webauthn/assert/begin`` (T8.9, F4, M3).

        Takes the approval request the signature is for. The challenge is stored
        against that id and consumed on use, so an assertion cannot be replayed
        against another document — which is the criterion.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnAssertBeginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebAuthnAssertBeginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebAuthnAssertBeginRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnAssertOptions'
          description: ''
  /api/v1/auth/webauthn/credentials:
    get:
      operationId: auth_webauthn_credentials_list
      description: |-
        ``GET`` and ``DELETE`` on the caller's enrolled authenticators (B5).

        A user manages their own; an administrator with ``users.manage`` may revoke
        somebody else's, which is B5's "an admin can revoke enrolled credentials".
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
