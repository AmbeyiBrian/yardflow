    User:
      type: object
      description: |-
        Drop fields the requesting user is not permitted to see.

        Subclasses set ``permission_gated_fields`` — a mapping of permission
        codename to the field names it unlocks.

        With no request in context (a management command, a test building a
        serializer directly, an export running in Celery) **nothing is dropped**.
        Those callers have already passed whatever check applies to them, and
        silently emptying their output would be a bug that only shows up in a
        report somebody trusted.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          nullable: true
          description: Normalised to digits with an optional leading '+'.
          maxLength: 20
        full_name:
          type: string
          maxLength: 200
        is_active:
          type: boolean
          readOnly: true
        day_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Cost of a day of this person's time, excluding VAT. Not pay.
        roles:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        can_be_deleted:
          type: boolean
          readOnly: true
        has_signed_in_yet:
          type: boolean
          description: Whether they have set a password. Never the password itself.
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - can_be_deleted
      - date_joined
      - has_signed_in_yet
      - id
      - is_active
      - last_login
      - permissions
      - roles
    UserRequest:
      type: object
      description: |-
