      description: |-
        ``/api/v1/movements`` — the ledger, read-only (§3.2, M1).

        Append-only, and written only by ``post_movement``. There is no endpoint that
        creates one directly: every movement belongs to a document, and one that
        belonged to nothing would be unexplainable to an auditor.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: document_type
        schema:
          type: string
      - in: query
        name: from_node
        schema:
          type: integer
      - in: query
        name: item_type
        schema:
          type: integer
      - in: query
        name: movement_type
        schema:
          type: string
          enum:
          - ADJUST
          - CONSUME
          - DISPOSE
          - INSTALL
          - ISSUE
          - QUARANTINE
          - RECEIPT
          - RESTORE
          - RETURN
          - REVERSAL
          - TRANSFER
        description: |-
          * `RECEIPT` - Received
          * `ISSUE` - Issued
          * `TRANSFER` - Transferred
          * `INSTALL` - Installed at a site
          * `CONSUME` - Consumed on site
          * `RETURN` - Returned
          * `QUARANTINE` - Moved to quarantine
          * `RESTORE` - Restored to serviceable
          * `DISPOSE` - Disposed of
          * `ADJUST` - Adjusted after a count
          * `REVERSAL` - Reversal of an earlier movement
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: owner_client
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: to_node
