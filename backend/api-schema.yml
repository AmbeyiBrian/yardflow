          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportExportRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: The file, when it was small enough.
        '202':
          description: Queued. The caller is notified with an expiring link when it
            is ready (T7.5).
