      description: |-
        ``/api/v1/sync-exceptions`` (§8.4, N3, T8.7).

        T8.7's criterion is "every synced conflict is resolvable **without developer
        intervention**", which is why the payload and the refusal details are on the
        serializer rather than in a log line somebody would have to be shown.
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - DISCARDED
          - OPEN
          - RESOLVED
        description: |-
          * `OPEN` - Open
          * `RESOLVED` - Resolved
          * `DISCARDED` - Discarded
      tags:
      - sync-exceptions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSyncExceptionList'
