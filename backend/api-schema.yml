              $ref: '#/components/schemas/VarianceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variance'
          description: ''
  /api/v1/variances/{id}:
    get:
      operationId: variances_retrieve
      description: '``/api/v1/variances`` (H3, M1).'
      parameters:
      - in: path
        name: id
