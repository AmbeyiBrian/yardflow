    Organization:
      type: object
      description: A tenant as the console sees it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          description: Subdomain addressing this tenant, e.g. 'silvertech'. Immutable.
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          allOf:
          - $ref: '#/components/schemas/OrganizationStatusEnum'
          readOnly: true
        legal_name:
          type: string
          maxLength: 255
        tax_pin:
          type: string
          maxLength: 50
        phone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
