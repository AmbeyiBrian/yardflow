          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - INSTALLED
      - CONSUMED
      - RETURNING
      - RECOVERED
      type: string
      description: |-
        * `INSTALLED` - Installed at the site
        * `CONSUMED` - Consumed on site
        * `RETURNING` - Coming back to the yard
        * `RECOVERED` - Recovered from the site
    ApprovalAction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        decision:
          allOf:
          - $ref: '#/components/schemas/ApprovalActionDecisionEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_name:
          type: string
          readOnly: true
        on_behalf_of:
          type: integer
          readOnly: true
          nullable: true
        attribution:
          type: string
          readOnly: true
        auth_method:
          allOf:
          - $ref: '#/components/schemas/AuthMethodEnum'
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - actor_name
      - attribution
      - auth_method
      - decided_at
      - decision
      - id
      - on_behalf_of
      - reason
    ApprovalActionDecisionEnum:
      enum:
      - APPROVED
      - REJECTED
      - AUTO
      type: string
      description: |-
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `AUTO` - Automatically approved — no approval required
    ApprovalRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          type: string
          readOnly: true
        document_id:
          type: string
          readOnly: true
        document_number:
          type: string
          readOnly: true
        document:
          type: object
          additionalProperties: {}
          description: |-
            Enough of the document to decide without a second request.

            F4 wants approval possible "from my phone" — so the pending list has to
            carry what an approver needs to judge, not just a reference.
          readOnly: true
        level:
          type: integer
          readOnly: true
          description: Higher levels are more senior. Levels approve in order.
        required_role:
          type: integer
          readOnly: true
          nullable: true
        role_name:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        escalated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalAction'
          readOnly: true
      required:
      - actions
      - document
      - document_id
      - document_number
      - document_type
      - due_at
      - escalated_at
      - id
      - level
      - required_role
      - resolved_at
      - role_name
      - status
    ApprovalRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        criticality:
          $ref: '#/components/schemas/CriticalityEnum'
        required_role:
          type: integer
        role_name:
          type: string
          readOnly: true
        sequence:
          type: integer
          maximum: 2147483647
          minimum: 0
        conditions: {}
        is_active:
          type: boolean
        description:
          type: string
          maxLength: 255
      required:
      - category_name
      - criticality
      - id
      - required_role
      - role_name
    ApprovalRuleRequest:
      type: object
      properties:
        category:
          type: integer
          nullable: true
        criticality:
          $ref: '#/components/schemas/CriticalityEnum'
        required_role:
          type: integer
        sequence:
          type: integer
          maximum: 2147483647
          minimum: 0
        conditions: {}
        is_active:
          type: boolean
        description:
          type: string
          maxLength: 255
      required:
      - criticality
      - required_role
    ApprovalStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - ESCALATED
      - SUPERSEDED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `ESCALATED` - Escalated
        * `SUPERSEDED` - Superseded
    ApproveRequest:
      type: object
      description: |-
        An approval, optionally signed with a fingerprint (F4, M3, T8.9).

        The assertion is optional because §5.3 makes the step-up a *step-up*: a
        tenant with no enrolled devices, or an owner on a laptop with no sensor, still
        has to be able to approve. What changes is what ``ApprovalAction`` records —
        and an auditor can tell the two apart, which is the point.
      properties:
        reason:
          type: string
          maxLength: 500
        assertion:
          type: object
          additionalProperties: {}
    Attachment:
      type: object
      description: What a client reads back. The file itself is never inlined (N-7).
      properties:
        id:
          type: integer
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        uploaded_by:
          type: integer
          readOnly: true
          nullable: true
        uploaded_by_name:
          type: string
          readOnly: true
          default: ''
        download_url:
          type: string
          description: A signed link that expires, in both storage backends (N-7).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - download_url
      - filename
      - id
      - kind
      - size
      - target_id
      - target_type
      - uploaded_by
      - uploaded_by_name
    AttachmentTargets:
      type: object
      properties:
        targets:
          type: object
          additionalProperties:
            type: array
            items: {}
      required:
      - targets
    AttachmentUploadRequest:
