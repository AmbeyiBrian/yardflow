          minLength: 1
          description: Email address or phone number.
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - identifier
      - password
    LogoutRequest:
      type: object
      description: 'Revoke a refresh token (B1: refresh tokens are revocable).'
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    LowStock:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - results
    MarkedRead:
      type: object
      properties:
        marked:
          type: integer
      required:
      - marked
    Me:
      type: object
      description: |-
        ``GET /me`` — the payload the frontend drives navigation from (§7.2).

        Returns *resolved* permissions rather than roles alone, so the client never
        has to reimplement the resolution rules and then disagree with the server.
        The client gate is UX; the server re-checks every call.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        phone:
          type: string
          readOnly: true
          nullable: true
          description: Normalised to digits with an optional leading '+'.
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_platform_admin:
          type: boolean
          readOnly: true
        organization:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        roles:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            A platform admin holds no tenant roles.

            Asking for them would raise ``TenantContextMissing`` — they have no
            organization in context — and the handler would turn that into a
            404, making ``/me`` look like a missing endpoint (§2.1, §3).
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - full_name
      - id
      - is_active
      - is_platform_admin
      - organization
      - permissions
      - phone
      - roles
    MethodEnum:
      enum:
      - SCRAP_DEALER
      - LICENSED_HANDLER
      - DESTROYED_ON_SITE
      - RETURNED_TO_SUPPLIER
      - OTHER
      type: string
      description: |-
        * `SCRAP_DEALER` - Sold or given to a scrap dealer
        * `LICENSED_HANDLER` - Collected by a licensed e-waste handler
        * `DESTROYED_ON_SITE` - Destroyed on our premises
        * `RETURNED_TO_SUPPLIER` - Returned to the supplier
        * `OTHER` - Other — see the note
    Movement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        occurred_at:
          type: string
          format: date-time
        movement_type:
          $ref: '#/components/schemas/MovementTypeEnum'
        item_type:
          type: integer
        item_name:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        uom:
          type: string
          maxLength: 20
        from_node:
          type: integer
        from_label:
          type: string
          readOnly: true
        to_node:
          type: integer
        to_label:
          type: string
          readOnly: true
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        from_condition:
          description: |-
            Condition it was held in, when the movement changed it.

            * `NEW` - New
            * `USED_SERVICEABLE` - Used — serviceable
            * `FAULTY` - Faulty
            * `DAMAGED` - Damaged
            * `SCRAP` - Scrap
          oneOf:
          - $ref: '#/components/schemas/ConditionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        owner_type:
          $ref: '#/components/schemas/OwnerTypeEnum'
        owner_client:
          type: integer
          nullable: true
        owner_client_name:
          type: string
          readOnly: true
          default: ''
        serial_number:
          type: string
          readOnly: true
          default: ''
        drum_number:
          type: string
          readOnly: true
          default: ''
        document_type:
          type: string
          maxLength: 50
        document_number:
          type: string
          description: The document number as issued, for reporting.
          maxLength: 50
        document_id:
          type: string
          maxLength: 64
        posted_by:
          type: integer
          nullable: true
        posted_by_name:
          type: string
          readOnly: true
          default: ''
        note:
          type: string
          maxLength: 500
      required:
      - condition
      - drum_number
      - from_label
      - from_node
      - id
      - item_name
      - item_type
      - movement_type
      - occurred_at
      - owner_client_name
      - owner_type
      - posted_by_name
      - quantity
      - serial_number
      - to_label
      - to_node
      - uom
    MovementTypeEnum:
      enum:
      - RECEIPT
      - ISSUE
      - TRANSFER
      - INSTALL
      - CONSUME
      - RETURN
      - QUARANTINE
      - RESTORE
      - DISPOSE
      - ADJUST
      - REVERSAL
      type: string
      description: |-
        * `RECEIPT` - Received
        * `ISSUE` - Issued
        * `TRANSFER` - Transferred
        * `INSTALL` - Installed at a site
        * `CONSUME` - Consumed on site
        * `RETURN` - Returned
        * `QUARANTINE` - Moved to quarantine
        * `RESTORE` - Restored to serviceable
        * `DISPOSE` - Disposed of
        * `ADJUST` - Adjusted after a count
        * `REVERSAL` - Reversal of an earlier movement
