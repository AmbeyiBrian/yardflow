          maxLength: 20
        full_name:
          type: string
          maxLength: 200
        day_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Cost of a day of this person's time, excluding VAT. Not pay.
        role_ids:
          type: array
          items:
            type: integer
          writeOnly: true
