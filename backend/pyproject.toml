[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yardflow-backend"
version = "0.1.0"
description = "Yard inventory and gate control — Django REST backend"
requires-python = ">=3.12"

# Pins are the versions actually resolved and installed, not guesses.
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "django-filter==26.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.4",
    "celery==5.6.3",
    "redis==8.1.0",
    "django-storages==1.14.6",
    "boto3==1.43.77",
    "openpyxl==3.1.5",
    "qrcode==8.2",
    "pillow==12.3.0",
    "python-json-logger==4.2.0",
    "whitenoise==6.12.0",
    "gunicorn==26.1.0",
    # WebAuthn step-up on approval (B5, D9, §5.3). Used from Phase 8.
    "webauthn==3.0.0",
    # PDF rendering for gate passes, GRNs and waybills (G4, K2, §11).
    # Needs GTK libraries present on the host; only imported by Phase 4 code.
    "WeasyPrint==69.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "ruff==0.15.1",
    "mypy==1.19.0",
    "django-stubs==5.2.7",
]

[tool.setuptools]
# The apps are top-level packages inside backend/, not a src layout.
packages = [
    "config",
    "core",
    "accounts",
    "catalogue",
    "network",
    "locations",
    "stock",
    "receiving",
    "dispatch",
    "approvals",
    "jobs",
    "custody",
    "disposition",
    "notifications",
    "reporting",
    "sync",
    "platform_admin",
]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = [
    "--strict-markers",
    "--reuse-db",
    "-ra",
]
testpaths = ["."]
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "rls: asserts Postgres row-level security, and must run as the unprivileged app role",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "B008",   # DRF and Django idiomatically call functions in argument defaults
    "RUF012", # Django class attributes are conventionally mutable
    # Comments and docstrings quote the requirements document, which uses
    # en dashes and other real typography. That is deliberate.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules intentionally use star imports to layer environments.
"config/settings/*.py" = ["F403", "F405"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
