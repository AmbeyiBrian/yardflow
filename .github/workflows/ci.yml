# CI and deployment for YardFlow (design §12.2, §14; task T1.23).
#
# Tests gate everything. The two images are built only after they pass, and the
# box is only touched after the images exist — so a red build never reaches
# production and a failed push never leaves the box pulling a tag that is not
# there.
#
# The images are built **here** rather than on the instance. A 2 GB box running
# Postgres cannot also run `npm ci` and a Docker build without the kernel
# killing something, and building in one place means the artifact that was
# tested is the artifact that runs.
#
# Postgres is a service container rather than SQLite, because the guarantees
# under test cannot be expressed in SQLite: row-level security (§2.3), the
# append-only triggers on the audit trail and the stock ledger (§3.2, M3), and
# the `SELECT FOR UPDATE` behaviour that keeps document numbers gap-free (M6).
# A suite that skipped those would pass while the real barriers went unverified.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yardflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The application role is created below as non-superuser and
      # non-BYPASSRLS, so row-level security is genuinely enforced against the
      # test run rather than silently bypassed (T1.7, §2.3).
      DATABASE_URL: postgres://yardflow_app:yardflow@localhost:5432/yardflow
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yardflow
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # WeasyPrint renders the gate pass, GRN and waybills. Without these the
      # import fails and every document quietly degrades to HTML, so CI would
      # be green while the thing a driver carries was never produced (§11, G4).
      - name: System libraries for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libffi-dev

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create the least-privilege application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "
            CREATE ROLE yardflow_app LOGIN PASSWORD 'yardflow'
              NOSUPERUSER NOCREATEROLE NOBYPASSRLS CREATEDB;"
          psql -h localhost -U postgres -d yardflow -v ON_ERROR_STOP=1 -c "
            GRANT USAGE, CREATE ON SCHEMA public TO yardflow_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO yardflow_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO yardflow_app;"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy .

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml

      # A3 is non-negotiable and runs as its own step so a failure is
      # unmistakable in the log rather than buried in the full suite.
      - name: Tenant isolation suite (requirement A3)
        working-directory: backend
        run: pytest core/tests/test_isolation_suite.py -v

      - name: OpenAPI schema is committed and current (N-10)
        working-directory: backend
        run: pytest core/tests/test_schema.py -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the frontend exists yet
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ is scaffolded in T1.27; nothing to build yet."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # Deployment (§12.2). Only from `main`, only after the tests above passed.
  # ---------------------------------------------------------------------------

  images:
    name: Build and push images
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to GHCR. Nothing here needs write access to the repository.
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      web: ${{ steps.names.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image names
        id: names
        # GHCR rejects an upper-case path, and the owner here is `AmbeyiBrian`.
        # Tagged with the commit as well as `latest` so a rollback names a
        # specific build rather than "whatever latest used to be".
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/yardflow-backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/yardflow-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image (Caddy with the built SPA)
        uses: docker/build-push-action@v6
        with:
          # The repository root: it needs both `frontend/` and `deploy/`.
          context: .
          file: ./deploy/web.Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.web }}:latest
            ${{ steps.names.outputs.web }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: images
    # Skipped, not failed, until the box exists and its secrets are set. A
    # pipeline that goes red because infrastructure has not been built yet
    # teaches everyone to ignore a red pipeline.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # One at a time, and never cancelled halfway: a deploy interrupted between
    # `migrate` and `up` would leave the old containers against a new schema.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authorise this runner against the box
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The host key is pinned rather than accepted blindly: without it this
          # step would trust whatever answers on that address.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull the new images and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          BACKEND: ${{ needs.images.outputs.backend }}:${{ github.sha }}
          WEB: ${{ needs.images.outputs.web }}:${{ github.sha }}
          # Short-lived and scoped to this run. A long-lived personal token
          # sitting on the instance would be a standing credential for every
          # package in the account.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o BatchMode=yes "${USER}@${HOST}" bash -s <<EOF
            set -euo pipefail
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ~/yardflow
            git fetch --all --quiet
            # The compose file and the scripts come from the repository; the
            # application itself comes from the images.
            git checkout --quiet ${{ github.sha }}
            export BACKEND_IMAGE="${BACKEND}"
            export WEB_IMAGE="${WEB}"
            # `bash` explicitly: the executable bit is not something to depend
            # on. It was never recorded from a Windows checkout, and a
            # \`git checkout\` of a changed script rewrote the box's copy without
            # it -- the deploy died with "Permission denied" on its own script.
            bash ./deploy/deploy.sh
            docker logout ghcr.io
          EOF

      - name: Say what is running
        if: success()
        run: echo "::notice::Deployed ${{ github.sha }} to ${{ secrets.DEPLOY_HOST }}"
