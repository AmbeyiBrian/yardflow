# Production stack for a single Lightsail instance (design §12.2).
#
# This is the small deployment, not the one in §12.1. Everything runs on one
# box: Postgres and Redis alongside the app rather than as managed services.
# That is a deliberate trade — it costs about a tenth as much, and it means a
# deploy has a few seconds of downtime and a box failure is an outage rather
# than a failover. For one tenant that is the right trade; §12.1 remains the
# target once there are tenants who would notice.
#
# What is *not* traded away is durability: the database is dumped off the box
# every night (`backup.sh`), because rebuilding a machine is an afternoon and
# losing the records is the business.
#
# **Nothing is built here.** Both images are built in CI and pulled. A 2 GB box
# running Postgres cannot also run `npm ci` and a Docker build without the
# kernel killing something, and the artifact that was tested should be the
# artifact that runs.
#
#   ./deploy/deploy.sh          — the normal path
#   docker compose --env-file .env ps
#
# Secrets come from `.env`, which is not in the repository (N-4).

name: yardflow

x-app: &app
  image: ${BACKEND_IMAGE:-ghcr.io/ambeyibrian/yardflow-backend:latest}
  restart: unless-stopped
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Tuned for a small box. Postgres's defaults assume it owns the machine; here
    # it shares 1 GB with the application it serves.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-50}
      - -c
      - work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port. Postgres is reachable only from this compose network,
    # so the box never exposes a database to the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `--save 60 1` keeps the queue across a restart. The tasks here are
    # notifications and nightly checks; losing a few on reboot is survivable,
    # losing them silently on every deploy is not.
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      # A cache that is allowed to grow without limit will take the memory the
      # database needs, on a box where there is not much of either.
      - --maxmemory
      - "${REDIS_MAXMEMORY:-96mb}"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # The proxy probes over HTTP on the compose network, so the redirect to
      # HTTPS every other request gets would turn a healthy container into a
      # failing probe.
      HEALTH_CHECK_HOST: web
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    # The scheduler runs **inside** the worker (`-B`) rather than as its own
    # container. A second Python process costs about 120 MB, which on a 1 GB box
    # is the difference between comfortable and swapping.
    #
    # This is safe here and only here: §12.2 is one box with exactly one worker.
    # Two workers with `-B` would each fire the schedule, and the nightly ledger
    # verification would alert twice about a single drift. If this ever scales
    # past one worker, beat goes back to being its own container.
    #
    # Concurrency follows the box: 1 on the small instance, 2 where there is room.
    command:
      - celery
      - -A
      - config
      - worker
      - --beat
      - --loglevel
      - info
      - --concurrency
      - "${CELERY_CONCURRENCY:-2}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  caddy:
    image: ${WEB_IMAGE:-ghcr.io/ambeyibrian/yardflow-web:latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      # Certificates and ACME account keys. Losing this volume means every
      # certificate is requested again, which is how a rate limit gets hit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
